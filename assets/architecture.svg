<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" role="img" aria-label="Logs are pulled per run, archived in Azurite, then loaded into Kusto" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <style>
    .ink { fill: #e6edf3; } .quiet { fill: #9198a1; }
    .edge { stroke: #6e7681; } .arrowhead { fill: #6e7681; }
    .box { fill: #0d1117; stroke: #6e7681; stroke-width: 1.25; }
    .zone { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .accent { fill: #0c2d6b; stroke: #4493f8; stroke-width: 2; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="arrowhead" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="ink" x="24" y="34" font-size="15" font-weight="600">Logs are pulled per run, archived in Azurite, then loaded into Kusto</text>

  <rect class="zone" x="24" y="56" width="400" height="256" rx="8"/>
  <text class="ink" x="40" y="80" font-weight="600">Windows VM (IIS + PHP)</text>
  <rect class="zone" x="456" y="56" width="280" height="328" rx="8"/>
  <text class="ink" x="472" y="80" font-weight="600">Host machine</text>

  <g class="edge" fill="none" stroke-width="1.25">
    <path d="M272 124H282V196H292" marker-end="url(#arrow)"/>
    <path d="M272 196H292" marker-end="url(#arrow)"/>
    <path d="M272 268H282V196H292" marker-end="url(#arrow)"/>
    <path d="M408 196H440V124H472" marker-end="url(#arrow)"/>
    <path d="M596 152V168" marker-end="url(#arrow)"/>
    <path d="M596 224V240" marker-end="url(#arrow)"/>
    <path d="M596 296V312" marker-end="url(#arrow)"/>
    <path d="M224 344V312" marker-end="url(#arrow)"/>
  </g>

  <rect class="box" x="40" y="96" width="232" height="56" rx="8"/>
  <text class="ink" x="52" y="120" font-weight="600">IIS + PHP (FastCGI)</text>
  <text class="quiet" x="52" y="136" font-size="11.5">W3C, FREB, HTTPERR, php_errors.log</text>

  <rect class="box" x="40" y="168" width="232" height="56" rx="8"/>
  <text class="ink" x="52" y="192" font-weight="600">Windows Event Log</text>
  <text class="quiet" x="52" y="208" font-size="11.5">Security, Application, PS, IIS</text>

  <rect class="box" x="40" y="240" width="232" height="56" rx="8"/>
  <text class="ink" x="52" y="264" font-weight="600">Sysmon</text>
  <text class="quiet" x="52" y="280" font-size="11.5">verbose config (EDR stand-in)</text>

  <rect class="box" x="292" y="168" width="116" height="56" rx="8"/>
  <text class="ink" x="304" y="192" font-weight="600">Fluent Bit</text>
  <text class="quiet" x="304" y="208" font-size="11.5">C:\Lab\ship\*.jsonl</text>

  <rect class="box" x="472" y="96" width="248" height="56" rx="8"/>
  <text class="ink" x="484" y="120" font-weight="600">Run folder (collect-run.sh)</text>
  <text class="quiet" x="484" y="136" font-size="11.5">runs/&lt;id&gt;: jsonl + freb.zip</text>

  <rect class="box" x="472" y="168" width="248" height="56" rx="8"/>
  <text class="ink" x="484" y="192" font-weight="600">Azurite blob archive</text>
  <text class="quiet" x="484" y="208" font-size="11.5">winlab/runs/&lt;id&gt;/, HTTPS :10000</text>

  <rect class="box" x="472" y="240" width="248" height="56" rx="8"/>
  <text class="ink" x="484" y="264" font-weight="600">Kusto emulator: WinLab</text>
  <text class="quiet" x="484" y="280" font-size="11.5">Sentinel tables via transform.kql</text>

  <rect class="accent" x="472" y="312" width="248" height="56" rx="8"/>
  <text class="ink" x="484" y="336" font-weight="600">Detection queries (KQL)</text>
  <text class="ink" x="484" y="352" font-size="11.5">_ResourceId ties rows to a run</text>

  <rect class="box" x="24" y="344" width="400" height="56" rx="8"/>
  <text class="ink" x="36" y="368" font-weight="600">Host: test loop (hypervisor CLI)</text>
  <text class="quiet" x="36" y="384" font-size="11.5">revert snapshot, run in guest, curl trigger tagged LAB-RUN</text>
  <text class="quiet" x="232" y="332" font-size="11.5">drives the VM</text>
</svg>
