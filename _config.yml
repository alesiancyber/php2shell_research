title: php2shell research
url: https://alesiancyber.github.io
baseurl: /php2shell_research
description: What a PHP vulnerability leaves in the logs on Windows and IIS, and how to detect it.
remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme

search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

# Link back to the repository from every page (top-right of the header).
aux_links:
  "View on GitHub":
    - "https://github.com/alesiancyber/php2shell_research"
aux_links_new_tab: true

footer_content: 'Source, evidence CSVs, KQL and Sigma rules live in the <a href="https://github.com/alesiancyber/php2shell_research">php2shell_research repository on GitHub</a>.'
color_scheme: dark

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow

exclude:
  - lab-data/
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - "*.zip"
